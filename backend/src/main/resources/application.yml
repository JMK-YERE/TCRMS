spring:
  application:
    name: tcrms-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

tcrms:
  cors:
    allowed-origins: ${TCRMS_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
