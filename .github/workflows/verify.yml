name: Verify TCRMS backend

on:
  push:
    branches: ["main", "scaffold/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend verification
        run: mvn -B -f backend/pom.xml verify
