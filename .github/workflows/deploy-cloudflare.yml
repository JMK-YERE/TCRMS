name: TCRMS Cloudflare deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tcrms-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Validate JavaScript
        run: bun run check
      - name: Validate Wrangler deployment bundle
        run: bunx wrangler deploy --dry-run
      - name: Deploy to Cloudflare Workers
        if: env.CF_DEPLOY_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Report missing deployment credentials
        if: env.CF_DEPLOY_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: |
          echo "::warning::Cloudflare deployment skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets."
